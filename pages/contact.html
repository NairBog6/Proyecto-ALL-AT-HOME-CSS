<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - All At Home</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <header class="header-principal">
    <a href="../index.html" class="logo">All At Home</a>
    <nav class="navegacion">
      <a href="../index.html">Home</a>
      <a href="./about-us.html">About Us</a>
      <a href="./products.html">Products</a>
      <a href="./services.html">Services</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <section class="seccion-contenido">
      <h1 class="titulo-principal">Get in Touch</h1>
      <p class="parrafo-destacado">
        Do you have any questions or suggestions, or would you like to work with us? Leave us a message and we will get back to you shortly.
      </p>
      <form class="formulario-contacto">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName" placeholder="Your full name" required>
        <label for="email-address">Email Address</label>
        <input type="email" id="email-address" name="emailAddress" placeholder="example@mail.com" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
        <button type="submit" class="boton-accion">Send Message</button>
      </form>
    </section>
  </main>
  <footer class="footer-principal">
    <p>&copy; 2026 All At Home. All rights reserved.</p>
  </footer>
</body>
</html>
