<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ALL AT HOME</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS v5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Librería Animate.css CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- CSS personalizado (después de Bootstrap y Animate.css) -->
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <!-- Navbar Responsivo con Bootstrap y Logo -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
          <img src="../assets/image-1.jpeg" alt="All At Home Logo" width="36" height="36" class="rounded-circle object-fit-cover">
          <span>ALL AT HOME</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./about-us.html">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="seccion-contenido container my-5">
      <div class="text-center mb-5 animate__animated animate__fadeIn">
        <h1 class="titulo-principal">Get in Touch</h1>
        <p class="parrafo-destacado mx-auto" style="max-width: 700px;">
          Do you have any questions or suggestions, or would you like to work with us? Leave us a message and we will get back to you shortly.
        </p>
      </div>
      <!-- Formulario de Contacto centrado con Grilla y Controles Bootstrap -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card p-4 shadow-sm">
            <form class="formulario-contacto">
              <div class="mb-3">
                <label for="full-name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full-name" name="fullName" placeholder="Your full name" required>
              </div>
              <div class="mb-3">
                <label for="email-address" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email-address" name="emailAddress" placeholder="example@mail.com" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary boton-accion w-100">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer-principal text-center py-3">
    <p class="mb-0">&copy; 2026 All At Home. All rights reserved.</p>
  </footer>
  <!-- Bootstrap JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
